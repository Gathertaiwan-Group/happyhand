name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不指定 version：由根 package.json 的 packageManager 決定，
      # 兩邊都寫會撞 ERR_PNPM_BAD_PM_VERSION
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Build
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

  worker:
    name: Worker — typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不指定 version：由根 package.json 的 packageManager 決定，
      # 兩邊都寫會撞 ERR_PNPM_BAD_PM_VERSION
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter worker typecheck

      - name: Build
        run: pnpm --filter worker build

  # 🔴 這裡原本有 migrate job（push main 時 supabase link + db push），2026-10-09 移除。
  # 2026-10-08 起快樂手的資料庫併入集團合併專案（noijrmhdfbfvjyvchvzj），表在 happyhands schema：
  #   - secrets 裡的 SUPABASE_PROJECT_ID 是舊專案，舊庫關掉後每次 push main 都會失敗；
  #   - 把 secret 改成新專案更糟：新專案沒有這個 repo 的 migration 紀錄，db push 會把
  #     supabase/migrations（全部寫給 public）整套重放進合併專案的 public——那是小時光的 schema。
  # 之後要改 schema：寫成 happyhands.<表> 的 SQL，手動在合併專案套用
  # （見 alice-store/supabase/consolidation/95_cutover.md）。不要把這個 job 加回來。
